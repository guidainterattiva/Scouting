<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Scouting</title>
<meta name="theme-color" content="#0d4f33">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Scouting">
<style>
:root{--bg:#f3f5f4;--card:#fff;--ink:#14201b;--muted:#64746c;--line:#e1e7e4;--accent:#0f6b43;--accent-2:#e6f2eb;--danger:#b42318;--top:#0d4f33;--star:#e0a100;--warn-bg:#fff4dc;--warn:#7a4b00;--shadow:0 1px 2px rgba(0,0,0,.05),0 2px 8px rgba(0,0,0,.04)}
@media (prefers-color-scheme:dark){:root{--bg:#0e1412;--card:#18201d;--ink:#e8efeb;--muted:#93a39b;--line:#28332e;--accent:#45c486;--accent-2:#1a2b22;--danger:#ff7a6e;--top:#0a2a1d;--warn-bg:#3a2c10;--warn:#ffd68a;--shadow:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.top{position:sticky;top:0;z-index:10;background:var(--top);color:#fff;display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
.brand{font-weight:750;letter-spacing:.3px;display:flex;gap:8px;align-items:center;font-size:17px}
.brand svg{width:24px;height:24px}
.sync{margin-left:auto;display:flex;align-items:center;gap:6px;background:none;border:0;color:#fff;font-size:12px;opacity:.92;padding:6px 4px;white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:#7ee2a8;flex:none}
.sync.s-sync i{background:#8cc4ff;animation:pulse 1s infinite}
.sync.s-off i{background:#ffc35c}.sync.s-err i{background:#ff8a7e}
@keyframes pulse{50%{opacity:.25}}
@media (max-width:360px){.sync span{display:none}}
.findbtn{background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:999px;padding:7px 14px;display:flex;gap:6px;align-items:center;font-weight:600;font-size:14px;flex:none}
.findbtn svg{width:16px;height:16px}
main{max-width:720px;margin:0 auto;padding-bottom:calc(150px + env(safe-area-inset-bottom))}
.pad{padding:12px 16px}
.tabs{position:fixed;bottom:0;left:0;right:0;z-index:10;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;border:0;background:none;padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted)}
.tabs button.on{color:var(--accent);font-weight:650}
.tabs svg{width:23px;height:23px}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 12px;box-shadow:var(--shadow)}
.search input{flex:1;border:0;background:none;padding:11px 0;outline:none;min-width:0;font-size:16px}
.search svg{width:18px;height:18px;color:var(--muted);flex:none}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-size:13px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.filters{display:flex;gap:6px;margin:6px 0 12px}
.filters select{flex:1;min-width:0;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 6px;font-size:13px}
.count{font-size:12px;color:var(--muted);margin:0 0 8px 2px}
.pcard,.mcard{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px;box-shadow:var(--shadow)}
.av{width:52px;height:52px;border-radius:50%;object-fit:cover;flex:none;background:var(--accent-2)}
.av.ph{display:grid;place-items:center;font-weight:700;color:var(--accent)}
.av.big{width:96px;height:96px;font-size:30px}
.av.sm{width:40px;height:40px;font-size:14px}
.pc-main{flex:1;min-width:0}
.pc-name{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc-sub{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc-meta{font-size:12px;color:var(--muted)}
.newc{color:#fff;background:var(--danger);border-radius:999px;padding:1px 7px;font-weight:700;font-size:11px;margin-left:4px}
.g-pr{--g:#138a4c}.g-se{--g:#1d6fd1}.g-ri{--g:#c27c0e}.g-sc{--g:#7d8783}
.gb{flex:none;font-size:11px;font-weight:650;padding:3px 8px;border-radius:999px;white-space:nowrap;background:color-mix(in srgb,var(--g) 15%,transparent);color:var(--g)}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:14px 0}
.seg button{border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:8px 2px;font-size:12px;font-weight:650;color:var(--muted);line-height:1.2}
.seg button.on{background:var(--g);border-color:var(--g);color:#fff}
.seg-l{font-size:12px;color:var(--muted);margin:14px 0 -8px;font-weight:600}
.gline{margin:14px 0;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);font-weight:600}
.gline .gb{font-size:13px;padding:4px 12px}
.hero{display:flex;gap:16px;align-items:center;margin-top:6px}
.hero h1{font-size:22px;margin:0 0 2px;line-height:1.2}
.sub,.muted{color:var(--muted);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;box-shadow:var(--shadow)}
.card h3{margin:0 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}
.card p{margin:0}
.info{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.info span{display:block;font-size:12px;color:var(--muted)}
.info b{font-weight:600}
.sec-h{display:flex;justify-content:space-between;align-items:center;margin:20px 0 8px}
.sec-h h2{font-size:16px;margin:0}
.btn{border:0;background:var(--accent);color:#fff;border-radius:11px;padding:11px 16px;font-weight:650;text-align:center;display:inline-block}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:9px}
.btn.ghost{background:var(--accent-2);color:var(--accent)}
.btn.danger{background:color-mix(in srgb,var(--danger) 10%,transparent);color:var(--danger)}
.btn.block{display:block;width:100%;margin:10px 0}
.btn:disabled{opacity:.6}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.actions .btn{flex:1 1 30%}
.fab{position:fixed;right:16px;bottom:calc(74px + env(safe-area-inset-bottom));z-index:9;border:0;background:var(--accent);color:#fff;font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.22);border-radius:999px;padding:13px 20px}
.rep-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.rep-head{display:flex;gap:10px;align-items:center;flex:1;min-width:0;background:none;border:0;padding:0;text-align:left}
.link{background:none;border:0;padding:0;text-align:left;font-size:15px;font-weight:650}
.voto{font-weight:700;background:var(--accent-2);color:var(--accent);border-radius:8px;padding:3px 9px;font-size:13px;flex:none}
.area{border-top:1px solid var(--line);padding-top:8px;margin-top:8px}
.area-h{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}
.area p{margin:3px 0 0}
.pre{white-space:pre-wrap}
.stars{color:var(--star);letter-spacing:1px;font-size:14px;white-space:nowrap}
.stars i{color:var(--line);font-style:normal}
.rep-act{display:flex;justify-content:flex-end;margin-top:10px}
.medie{display:grid;grid-template-columns:1fr 1fr;gap:6px 16px}
.medie div{display:flex;justify-content:space-between;align-items:center;font-size:13px}
.empty{text-align:center;padding:44px 20px}
.empty h2{margin:10px 0 6px}
.empty p{color:var(--muted);margin:0 0 18px}
.empty .btn{margin:4px}
.empty-s{color:var(--muted);text-align:center;padding:18px;font-size:14px;border:1.5px dashed var(--line);border-radius:14px}
.banner{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:10px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.banner.info{background:var(--accent-2);color:var(--accent);border:0;width:100%;text-align:left;font-weight:650}
.back{background:none;border:0;color:var(--accent);padding:4px 0;font-weight:650}
.mcard .date{width:54px;flex:none;text-align:center;background:var(--accent-2);color:var(--accent);border-radius:10px;padding:6px 0;line-height:1.1}
.date b{display:block;font-size:20px}.date span{font-size:11px;text-transform:uppercase;font-weight:700}.date small{display:block;font-size:10px;opacity:.8}
.mhero h1{font-size:22px;margin:4px 0;line-height:1.2}
.res{font-size:20px;font-weight:750}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stat b{display:block;font-size:24px;color:var(--accent)}
.stat span{font-size:12px;color:var(--muted)}
.steps{margin:6px 0 0;padding-left:20px;font-size:14px}
.steps li{margin-bottom:4px}
.fsec{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);margin:14px 0 6px}
.me{display:flex;gap:12px;align-items:center}
.role{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--accent-2);color:var(--accent);margin-top:3px}
.cmt{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 12px;margin-bottom:8px}
.cmt.mine{border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.cmt-h{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.cmt-h span{color:var(--muted);font-size:12px;white-space:nowrap}
.cmt p{margin:3px 0 0}
.lnk{background:none;border:0;color:var(--danger);font-size:12.5px;padding:4px 0 0;font-weight:600}
.cmt-form{display:flex;gap:8px;align-items:flex-end;margin-top:6px}
.cmt-form textarea{flex:1;min-width:0;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 11px;font-size:16px;resize:vertical}
#sheet{position:fixed;inset:0;z-index:50}
#sheet[hidden]{display:none}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.sheet-panel{position:absolute;left:0;right:0;bottom:0;top:calc(env(safe-area-inset-top) + 20px);max-width:720px;margin:0 auto;background:var(--bg);border-radius:18px 18px 0 0;display:flex;flex-direction:column;animation:up .22s ease}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.sheet-h{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.sheet-h h2{margin:0;font-size:17px}
.x{border:0;background:var(--accent-2);color:var(--accent);width:32px;height:32px;border-radius:50%;font-size:15px;flex:none}
.sheet-b{flex:1;overflow:auto;padding:14px 16px 24px;-webkit-overflow-scrolling:touch}
.sheet-f{display:flex;gap:8px;padding:10px 16px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--card)}
.sheet-f .btn{flex:1}
.sheet-f:empty{display:none}
form label{display:block;font-size:12.5px;font-weight:650;color:var(--muted);margin-bottom:12px}
form label input:not([type=file]),form label select,form label textarea{display:block;width:100%;margin-top:4px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 11px;font-size:16px;font-weight:400;color:var(--ink);-webkit-appearance:none;appearance:none}
.area-in textarea{display:block;width:100%;border-radius:10px;padding:10px 11px;font-size:16px;color:var(--ink);margin-top:6px;border:1px solid transparent;background:var(--bg)}
form select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:28px}
form input[type=date]{min-height:44px}
textarea{resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row2>*{min-width:0}
.photo-row{display:flex;gap:14px;align-items:center;margin-bottom:16px}
.photo-pick{width:96px;height:96px;border-radius:50%;overflow:hidden;flex:none;margin:0!important;background:var(--accent-2);display:grid;place-items:center;border:2px dashed color-mix(in srgb,var(--accent) 40%,transparent)}
.photo-pick img{width:100%;height:100%;object-fit:cover}
.photo-pick svg{width:34px;height:34px;color:var(--accent)}
.photo-tx{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.area-in{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px}
.stars-in{display:inline-flex}
.stars-in button{border:0;background:none;font-size:24px;padding:0 2px;color:var(--line);line-height:1}
.stars-in button.on{color:var(--star)}
.ctx{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:12px}
.ctx .pc-main b{display:block}
.tag{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:2px 6px;flex:none}
#toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(16px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:80;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
#login{position:fixed;inset:0;z-index:70;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px;overflow:auto}
#login[hidden]{display:none}
.login-box{width:100%;max-width:360px}
.login-logo{width:76px;height:76px;border-radius:22px;background:var(--top);color:#fff;display:grid;place-items:center;margin:0 auto 14px}
.login-logo svg{width:44px;height:44px}
.login-box h1{text-align:center;margin:0 0 4px;color:var(--accent)}
.login-box>p{text-align:center;margin:0 0 22px}
.lerr{color:var(--danger);font-size:13.5px;min-height:18px;margin:-4px 0 8px}
.lnote{font-size:12.5px;color:var(--muted);text-align:center;margin-top:14px}
#print{display:none}
/* ---------- STAMPA / PDF ---------- */
.pr{font:10.5pt/1.42 Helvetica,Arial,sans-serif;color:#111;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pr-head{border-bottom:3px solid #0d4f33;padding-bottom:6px;margin-bottom:14px}
.pr-head h1{font-size:16pt;margin:0;color:#0d4f33;letter-spacing:.4px;text-transform:uppercase}
.pr-head .s{font-size:11pt;color:#333;margin-top:2px;font-weight:600}
.pr-prof{break-inside:avoid;page-break-inside:avoid;border:1px solid #cfd6d2;border-radius:6px;padding:10px 12px;margin-bottom:12px}
.pr-prof h2{font-size:12.5pt;margin:0 0 8px;color:#0d4f33}
.pr-top{display:flex;gap:14px;align-items:flex-start}
.pr-top img,.pr-ph{width:88px;height:108px;object-fit:cover;border-radius:4px;flex:none;border:1px solid #ddd;background:#eef3f0}
.pr-tbl{border-collapse:collapse;font-size:10pt}
.pr-tbl td{padding:1.5px 12px 1.5px 0;vertical-align:top}
.pr-tbl td:first-child{color:#666;white-space:nowrap}
.pr-g{display:inline-block;margin-top:6px;font-weight:700;padding:2px 8px;border:1.5px solid currentColor;border-radius:4px;font-size:9.5pt}
.pr-sub{font-size:10.5pt;font-weight:700;margin:10px 0 2px;color:#0d4f33;border-bottom:1px solid #dde3e0;padding-bottom:2px}
.pr-area{margin-top:5px}
.pr-area b{font-size:9pt;text-transform:uppercase;letter-spacing:.3px;color:#0d4f33}
.pr-area p{margin:1px 0 0;white-space:pre-wrap}
.pr-st{color:#c58a00;font-size:10pt;margin-left:4px}
.pr-st i{color:#ccc;font-style:normal}
.pr-foot{font-size:8pt;color:#888;margin-top:14px;text-align:right}
@media print{
  @page{size:A4;margin:13mm}
  html,body{background:#fff!important;color:#000}
  #app,#sheet,#toast,#login{display:none!important}
  #print{display:block}
}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9.5"/><path d="M12 7.2l4 2.9-1.5 4.7h-5L8 10.1z" fill="currentColor" stroke="none"/><path d="M12 2.5v4.7M16 10.1l4.6-1.6M14.5 14.8l2.8 4M9.5 14.8l-2.8 4M8 10.1L3.4 8.5"/></svg>Scouting</div>
    <button id="sync" class="sync" data-go="/account"><i></i><span>…</span></button>
    <button class="findbtn" data-a="find"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>Trova</button>
  </header>
  <main id="view"></main>
  <nav class="tabs">
    <button data-go="/giocatori" data-tab="giocatori"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>Giocatori</button>
    <button data-go="/partite" data-tab="partite"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M12 5v14"/><circle cx="12" cy="12" r="2.6"/><path d="M3 9.5h2.5v5H3M21 9.5h-2.5v5H21"/></svg>Partite</button>
    <button data-go="/account" data-tab="account"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>Account</button>
  </nav>
</div>
<div id="sheet" hidden></div>
<div id="login" hidden></div>
<div id="toast"></div>
<div id="print"></div>

<script src="supabase.js"></script>
<script>
'use strict';
/* ==========================================================
   CONFIGURAZIONE SUPABASE
   Supabase → Project Settings → API (o "Connect"):
   - Project URL
   - Publishable key (o "anon public" key)
   La chiave pubblica è fatta per stare nel browser: i dati
   sono protetti dalle regole del database e dal login.
   ========================================================== */
const SUPABASE_URL='INSERISCI_PROJECT_URL';
const SUPABASE_KEY='INSERISCI_PUBLISHABLE_KEY';

/* =================== UTILITÀ =================== */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>(crypto.randomUUID?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return (c==='x'?r:(r&3|8)).toString(16);}));
const now=()=>new Date().toISOString();
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const terms=q=>norm(q).split(/\s+/).filter(Boolean);
const fmtD=d=>d?d.split('-').reverse().join('/'):'';

/* =================== DATABASE LOCALE (IndexedDB) =================== */
let db;
const TYPES=['players','matches','reports','comments'];
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open('scouting-db',2);r.onupgradeneeded=()=>{const d=r.result;for(const s of [...TYPES,'deleted'])if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:'id'});if(!d.objectStoreNames.contains('outbox'))d.createObjectStore('outbox',{keyPath:'key'});if(!d.objectStoreNames.contains('meta'))d.createObjectStore('meta');};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
function tx(store,mode,fn){return new Promise((res,rej)=>{const t=db.transaction(store,mode);const req=fn(t.objectStore(store));t.oncomplete=()=>res(req?req.result:undefined);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error);});}
const idbAll=s=>tx(s,'readonly',st=>st.getAll());
const idbGet=(s,k)=>tx(s,'readonly',st=>st.get(k));
const idbCount=s=>tx(s,'readonly',st=>st.count());
const idbPut=(s,o)=>tx(s,'readwrite',st=>st.put(o));
const idbDel=(s,id)=>tx(s,'readwrite',st=>st.delete(id));
const idbClear=s=>tx(s,'readwrite',st=>st.clear());
const metaGet=k=>tx('meta','readonly',st=>st.get(k));
const metaSet=(k,v)=>tx('meta','readwrite',st=>st.put(v,k));

const S={players:[],matches:[],reports:[],comments:[]};
const META={seen:{},seenBase:''};
let sb=null,ME=null;
const SYNC={state:'idle',pending:0,last:null,err:''};
const isScout=()=>!!ME&&ME.ruolo==='scout';

async function save(type,obj){obj.updatedAt=now();if(!obj.createdAt)obj.createdAt=obj.updatedAt;const a=S[type];const i=a.findIndex(x=>x.id===obj.id);if(i>=0)a[i]=obj;else a.push(obj);await idbPut(type,obj);await queue(type,obj.id,false);return obj;}
async function removeRec(type,id){S[type]=S[type].filter(x=>x.id!==id);await idbDel(type,id);await queue(type,id,true);}
async function queue(tipo,id,deleted){await idbPut('outbox',{key:tipo+':'+id,tipo,id,deleted:!!deleted,ts:now()});await countPending();scheduleSync();}
async function countPending(){SYNC.pending=await idbCount('outbox');paintSync();}

/* =================== SINCRONIZZAZIONE =================== */
let syncTimer=null,syncing=false,syncAgain=false;
function scheduleSync(ms=800){clearTimeout(syncTimer);syncTimer=setTimeout(doSync,ms);}
function setSync(state,err=''){SYNC.state=state;SYNC.err=err;paintSync();const st=$('#syncstate');if(st)st.innerHTML=syncText(true);}
function syncText(long){const n=SYNC.pending;
  if(SYNC.state==='sync')return 'Sincronizzo…';
  if(SYNC.state==='off')return n?`Offline · ${n} da inviare`:'Offline';
  if(SYNC.state==='err')return long?'Errore di sincronizzazione'+(SYNC.err?': '+esc(SYNC.err):''):'Errore sync';
  if(n)return `${n} da inviare`;
  return long&&SYNC.last?'Aggiornato alle '+new Date(SYNC.last).toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'}):'Aggiornato';}
function paintSync(){const b=$('#sync');if(!b)return;const s=SYNC.state==='ok'&&SYNC.pending?'off':SYNC.state;b.className='sync s-'+s;b.querySelector('span').textContent=syncText(false);}
async function doSync(){
  if(!sb||!ME)return;
  if(syncing){syncAgain=true;return;}
  if(!navigator.onLine){setSync('off');return;}
  syncing=true;setSync('sync');
  try{
    const {data:{session}}=await sb.auth.getSession();
    if(!session){syncing=false;if(navigator.onLine)showLogin('Sessione scaduta: accedi di nuovo. Le modifiche non inviate restano salvate.');return;}
    await push();const changed=await pull();
    SYNC.last=now();await countPending();setSync('ok');
    if(changed)softRender();
  }catch(e){console.warn('sync',e);setSync(navigator.onLine?'err':'off',navigator.onLine?(e&&e.message||'').slice(0,80):'');}
  finally{syncing=false;if(syncAgain){syncAgain=false;scheduleSync(200);}}
}
function rowFor(o){if(o.deleted){const d={id:o.id,updatedAt:o.ts};if(o.tipo==='comments'&&ME)d.autoreId=ME.id;return {id:o.id,tipo:o.tipo,data:d,deleted:true};}const d=S[o.tipo]&&S[o.tipo].find(x=>x.id===o.id);return d?{id:o.id,tipo:o.tipo,data:d,deleted:false}:null;}
const isNetErr=e=>!e||!e.code||/fetch|network|load failed/i.test(e.message||'');
async function push(){
  const items=await idbAll('outbox');let rejected=false;
  for(let i=0;i<items.length;i+=15){
    const chunk=items.slice(i,i+15);const rows=chunk.map(rowFor).filter(Boolean);
    let ok=chunk;
    if(rows.length){const {error}=await sb.from('records').upsert(rows);
      if(error){if(isNetErr(error))throw error;
        ok=[];for(const o of chunk){const r=rowFor(o);if(!r){ok.push(o);continue;}const {error:e2}=await sb.from('records').upsert([r]);if(!e2)ok.push(o);else if(isNetErr(e2))throw e2;else{ok.push(o);rejected=true;S[o.tipo]=S[o.tipo].filter(x=>x.id!==o.id);await idbDel(o.tipo,o.id);toast('Una modifica non è stata accettata dal server');console.warn(e2);}}
      }
    }
    for(const o of ok){const cur=await idbGet('outbox',o.key);if(cur&&cur.ts===o.ts)await idbDel('outbox',o.key);}
  }
  if(rejected)await metaSet('cursor',null);
}
async function pull(){
  const cursor=await metaGet('cursor');
  const from=cursor?new Date(new Date(cursor).getTime()-15000).toISOString():'1970-01-01T00:00:00Z';
  let changed=false,max=cursor||'',page=0;const N=200;
  for(;;){
    const {data,error}=await sb.from('records').select('id,tipo,data,deleted,updated_at').gt('updated_at',from).order('updated_at',{ascending:true}).range(page*N,page*N+N-1);
    if(error)throw error;
    for(const r of data){if(await applyRemote(r))changed=true;if(!max||new Date(r.updated_at)>new Date(max))max=r.updated_at;}
    if(data.length<N)break;page++;
  }
  if(max&&max!==cursor)await metaSet('cursor',max);
  return changed;
}
async function applyRemote(r){
  const t=r.tipo;if(!S[t])return false;
  const local=S[t].find(x=>x.id===r.id);const ru=(r.data&&r.data.updatedAt)||'';
  const pend=await idbGet('outbox',t+':'+r.id);
  if(pend){const lu=pend.deleted?pend.ts:(local&&local.updatedAt)||'';if(lu>=ru)return false;await idbDel('outbox',pend.key);}
  if(r.deleted){if(!local)return false;S[t]=S[t].filter(x=>x.id!==r.id);await idbDel(t,r.id);return true;}
  if(local&&(local.updatedAt||'')>=ru)return false;
  const o=r.data;if(local){S[t][S[t].indexOf(local)]=o;}else S[t].push(o);await idbPut(t,o);return true;
}

function showLogin(msg){

  :'<div class="empty-s">App non ancora configurata: inserisci Project URL e chiave di Supabase in index.html.</div>'}</div>`;

async function loadProfile(user){const {data,error}=await sb.from('profili').select('id,email,nome,ruolo').eq('id',user.id).maybeSingle();if(error)throw error;if(data)await metaSet('me',data);return data;}
async function wipeLocal(){for(const s of [...TYPES,'deleted','outbox','meta'])await idbClear(s);TYPES.forEach(t=>S[t]=[]);META.seen={};META.seenBase='';SYNC.pending=0;SYNC.last=null;}
async function doLogin(f){
  const btn=f.querySelector('button[type=submit]'),err=$('#lerr');btn.disabled=true;err.textContent='';
  try{
    const email=f.elements.email.value.trim(),password=f.elements.password.value;
    const {data,error}=await sb.auth.signInWithPassword({email,password});
    if(error){err.textContent=/invalid/i.test(error.message)?'Email o password non corretti':(navigator.onLine?error.message:'Serve la connessione per accedere');return;}
    const prof=await loadProfile(data.user);
    if(!prof){await sb.auth.signOut();err.textContent='Utente non abilitato: contatta l\'amministratore.';return;}
    const prev=await metaGet('me');
    if(prev&&prev.id!==prof.id){await wipeLocal();await metaSet('me',prof);}
    if((await metaGet('migrated'))!==prof.id){
      if(prof.ruolo==='scout'){for(const t of ['players','matches','reports'])for(const o of S[t])await idbPut('outbox',{key:t+':'+o.id,tipo:t,id:o.id,deleted:false,ts:now()});}
      else{await wipeLocal();await metaSet('me',prof);}
      await metaSet('migrated',prof.id);META.seenBase=now();await metaSet('seenBase',META.seenBase);
    }
    ME=prof;start();toast('Benvenuto '+(prof.nome||''));
  }catch(e){err.textContent=navigator.onLine?'Errore di connessione al server':'Serve la connessione per accedere';console.warn(e);}
  finally{btn.disabled=false;}
}
async function doLogout(){
  await countPending();
  if(SYNC.pending&&!confirm(`Ci sono ${SYNC.pending} modifiche non ancora inviate al server: se esci andranno perse. Uscire comunque?`))return;
  if(!SYNC.pending&&!confirm('Uscire? I dati verranno rimossi da questo dispositivo (restano salvati online).'))return;
  try{await sb.auth.signOut();}catch(e){}
  await wipeLocal();ME=null;location.hash='';showLogin();
}
function start(){$('#login').hidden=true;render();countPending();scheduleSync(50);}

const P=id=>S.players.find(p=>p.id===id);
const M=id=>S.matches.find(m=>m.id===id);
const byDateDesc=(a,b)=>(b.data||'').localeCompare(a.data||'');
const repsOfPlayer=id=>S.reports.filter(r=>r.playerId===id).sort((a,b)=>(M(b.matchId)?.data||'').localeCompare(M(a.matchId)?.data||''));
const repsOfMatch=id=>S.reports.filter(r=>r.matchId===id);
const commentsOf=id=>S.comments.filter(c=>c.playerId===id).sort((a,b)=>(a.createdAt||'').localeCompare(b.createdAt||''));
function newComments(pid){if(!ME)return 0;const base=[META.seenBase||'',META.seen[pid]||''].sort().pop();return S.comments.filter(c=>c.playerId===pid&&c.autoreId!==ME.id&&(c.createdAt||'')>base).length;}
const fullName=p=>p?[String(p.cognome||'').toUpperCase(),p.nome].filter(Boolean).join(' '):'';
const initials=p=>((p.cognome||'?')[0]+((p.nome||'')[0]||'')).toUpperCase();
const age=d=>{if(!d)return '';const b=new Date(d+'T12:00'),n=new Date();let a=n.getFullYear()-b.getFullYear();const m=n.getMonth()-b.getMonth();if(m<0||(m===0&&n.getDate()<b.getDate()))a--;return a;};
const matchTitle=m=>m?`${m.casa||'?'} – ${m.ospite||'?'}`:'Partita eliminata';
const avatar=(p,cls='')=>p&&p.foto?`<img class="av ${cls}" src="${p.foto}" alt="">`:`<div class="av ph ${cls}">${esc(p?initials(p):'?')}</div>`;
const gBadge=g=>GIUDIZI[g]?`<span class="gb ${GIUDIZI[g].c}">${GIUDIZI[g].l}</span>`:'';
const stars=v=>{v=Math.round(v||0);return `<span class="stars">${'★'.repeat(v)}<i>${'★'.repeat(5-v)}</i></span>`;};
const opts=(arr,sel)=>arr.map(x=>`<option value="${esc(x)}" ${x===(sel||'')?'selected':''}>${esc(x||'—')}</option>`).join('');
const giudOpts=sel=>`<option value="">Non definito</option>`+Object.entries(GIUDIZI).map(([k,g])=>`<option value="${k}" ${k===sel?'selected':''}>${g.l}</option>`).join('');
function medie(pid){const r=repsOfPlayer(pid);const o={};AREE.forEach(([k])=>{const v=r.map(x=>x.voti&&x.voti[k]).filter(Boolean);o[k]=v.length?v.reduce((a,b)=>a+b,0)/v.length:null;});const vt=r.map(x=>parseFloat(x.voto)).filter(x=>!isNaN(x));o.voto=vt.length?vt.reduce((a,b)=>a+b,0)/vt.length:null;return o;}
function playerHay(p){return norm([p.cognome,p.nome,p.squadra,p.ruolo,p.numero,p.piede,(p.nascita||'').slice(0,4),p.note,...repsOfPlayer(p.id).flatMap(r=>[r.note,...Object.values(r.testi||{})]),...commentsOf(p.id).map(c=>c.testo)].join(' '));}
function datalists(){const sq=[...new Set([...S.players.map(p=>p.squadra),...S.matches.flatMap(m=>[m.casa,m.ospite])].filter(Boolean))].sort();const ru=[...new Set([...RUOLI,...S.players.map(p=>p.ruolo).filter(Boolean)])];const ca=[...new Set([...S.matches.map(m=>m.categoria).filter(Boolean),...CATEGORIE])];
return `<datalist id="dl-sq">${sq.map(x=>`<option value="${esc(x)}">`).join('')}</datalist><datalist id="dl-ruoli">${ru.map(x=>`<option value="${esc(x)}">`).join('')}</datalist><datalist id="dl-cat">${ca.map(x=>`<option value="${esc(x)}">`).join('')}</datalist><datalist id="dl-piede"><option value="Destro"><option value="Sinistro"><option value="Ambidestro"><option value="Ambidestro (destro di base)"><option value="Ambidestro (sinistro di base)"></datalist>`;}

function filteredPlayers(){
  const q=terms(UI.pq);
  const a=S.players.filter(p=>{if(UI.nc&&!newComments(p.id))return false;if(UI.pg&&(p.giudizio||'')!==UI.pg)return false;if(UI.pr&&p.ruolo!==UI.pr)return false;if(UI.pa&&!(p.nascita||'').startsWith(UI.pa))return false;if(q.length){const h=playerHay(p);return q.every(t=>h.includes(t));}return true;});
  const s=UI.sort;
  a.sort((x,y)=>s==='recenti'?(y.updatedAt||'').localeCompare(x.updatedAt||''):s==='eta'?(y.nascita||'').localeCompare(x.nascita||''):s==='giudizio'?(GORD[x.giudizio||'']-GORD[y.giudizio||''])||fullName(x).localeCompare(fullName(y)):fullName(x).localeCompare(fullName(y)));
  return a;
}
function pCard(p,extra=''){const n=repsOfPlayer(p.id).length,nc=commentsOf(p.id).length,nn=newComments(p.id);
  const meta=[p.nascita?`Classe ${p.nascita.slice(0,4)} · ${age(p.nascita)} anni`:'',n?`${n} oss.`:'',nc?`💬 ${nc}`:''].filter(Boolean).join(' · ');

function commentsBlock(pid){

function repBody(r){return AREE.map(([k,l])=>{const t=r.testi&&r.testi[k],v=r.voti&&r.voti[k];if(!t&&!v)return '';return `<div class="area"><div class="area-h"><span>${l}</span>${v?stars(v):''}</div>${t?`<p class="pre">${esc(t)}</p>`:''}</div>`;}).join('')+(r.note?`<div class="area"><div class="area-h"><span>Note / da valutare</span></div><p class="pre">${esc(r.note)}</p></div>`:'');}

function compress(file,max=640,q=.76){return new Promise((res,rej)=>{const url=URL.createObjectURL(file);const img=new Image();img.onload=()=>{const r=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));const w=Math.round(img.naturalWidth*r),h=Math.round(img.naturalHeight*r);const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',q));};img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('img'));};img.src=url;});}

function starsIn(k,v){return `<span class="stars-in">${[1,2,3,4,5].map(i=>`<button type="button" data-a="star" data-k="${k}" data-v="${i}" class="${i<=(v||0)?'on':''}" aria-label="${i} stelle">★</button>`).join('')}</span>`;}
function fReport(r){
  const editing=!!r.id;SH={voti:Object.assign({},r.voti||{}),rep:r};
  const p=P(r.playerId);const m=r.matchId?M(r.matchId):null;
  let matchField;
  if(r.matchId){matchField=`<div class="ctx"><div class="pc-main"><span class="muted">Partita</span><b>${esc(matchTitle(m))}</b><span class="muted">${fmtD(m&&m.data)}${m&&m.categoria?' · '+esc(m.categoria):''}</span></div></div><input type="hidden" name="matchId" value="${r.matchId}">`;}
  else{
    const done=new Set(repsOfPlayer(r.playerId).map(x=>x.matchId));
    const ms=S.matches.filter(x=>!done.has(x.id)).sort(byDateDesc);
    const def=ms.length?ms[0].id:'__new';
    matchField=`<label>Partita<select name="matchId">${ms.map(x=>`<option value="${x.id}" ${x.id===def?'selected':''}>${fmtD(x.data)} · ${esc(matchTitle(x))}</option>`).join('')}<option value="__new" ${def==='__new'?'selected':''}>+ Nuova partita…</option></select></label>
    <div id="newMatch" ${def==='__new'?'':'hidden'}><div class="fsec">Nuova partita</div>${matchFields({})}</div>`;
  }
  openSheet(editing?'Modifica osservazione':'Nuova osservazione',`<form id="fr" autocomplete="off">

  ${matchField}
  <div class="row2"><label>Ruolo in partita<input name="ruoloPartita" list="dl-ruoli" value="${esc(r.ruoloPartita||'')}" placeholder="${esc((p&&p.ruolo)||'')}"></label><label>Voto partita<select name="voto">${opts(['','4','4.5','5','5.5','6','6.5','7','7.5','8','8.5','9','9.5','10'],r.voto)}</select></label></div>
  <div class="fsec">Analisi tecnica e tattica</div>
  ${AREE.map(([k,l,ph])=>`<div class="area-in"><div class="area-h"><span>${l}</span>${starsIn(k,SH.voti[k])}</div><textarea name="t_${k}" rows="3" placeholder="${ph}">${esc((r.testi&&r.testi[k])||'')}</textarea></div>`).join('')}

  <label>Giudizio finale sul giocatore<select name="giudizio">${giudOpts(p&&p.giudizio)}</select></label>
  ${datalists()}</form>`,`${editing?'<button class="btn danger" data-a="delReport" style="flex:0 0 auto">Elimina</button>':''}<button class="btn ghost" data-a="close">Annulla</button><button class="btn" type="submit" form="fr">Salva</button>`);

function findResults(){
  const q=terms(UI.fq);

  const ps=S.players.filter(p=>{const h=playerHay(p);return q.every(t=>h.includes(t));}).slice(0,40);
  const ms=S.matches.filter(m=>q.every(t=>norm([m.casa,m.ospite,m.categoria,m.luogo,fmtD(m.data)].join(' ')).includes(t))).sort(byDateDesc).slice(0,20);

}

const prStars=v=>{v=Math.round(v||0);return v?`<span class="pr-st">${'★'.repeat(v)}<i>${'★'.repeat(5-v)}</i></span>`:'';};
const prG=g=>GIUDIZI[g]?`<span class="pr-g" style="color:${GIUDIZI[g].col}">Giudizio: ${GIUDIZI[g].l}</span>`:'';
const prPhoto=p=>p&&p.foto?`<img src="${p.foto}" alt="">`:'<div class="pr-ph"></div>';
function prAreas(r){return AREE.map(([k,l])=>{const t=r.testi&&r.testi[k],v=r.voti&&r.voti[k];if(!t&&!v)return '';return `<div class="pr-area"><b>${l}</b>${prStars(v)}${t?`<p>${esc(t)}</p>`:''}</div>`;}).join('')+(r.note?`<div class="pr-area"><b>Note / da valutare</b><p>${esc(r.note)}</p></div>`:'');}
function prTable(p,r){const rows=[['Squadra',p.squadra],['Numero di maglia',p.numero],['Data di nascita',p.nascita?`${fmtD(p.nascita)} (${age(p.nascita)} anni)`:''],['Ruolo',(r&&r.ruoloPartita)||p.ruolo],['Piede',p.piede],['Altezza',p.altezza?p.altezza+' cm':''],['Voto partita',r&&r.voto]].filter(x=>x[1]);return `<table class="pr-tbl">${rows.map(([l,v])=>`<tr><td>${l}</td><td><b>${esc(v)}</b></td></tr>`).join('')}</table>`;}
const prFoot=()=>`<div class="pr-foot">Generato il ${new Date().toLocaleString('it-IT',{dateStyle:'short',timeStyle:'short'})}</div>`;
function printHTML(html,title){
  const el=$('#print');el.innerHTML=`<div class="pr">${html}</div>`;
  const old=document.title;document.title=title.replace(/[\\/:*?"<>|]/g,'-');
  const imgs=[...el.querySelectorAll('img')];
  Promise.all(imgs.map(i=>i.complete?1:new Promise(r=>{i.onload=i.onerror=r;}))).then(()=>setTimeout(()=>{window.print&&window.print();setTimeout(()=>{document.title=old;},800);},150));
}
function pdfMatch(id){
  const m=M(id);const reps=sortedMatchReps(id);
  const html=`<div class="pr-head"><h1>Scheda tecnica di scouting</h1><div class="s">${esc(matchTitle(m))}${m.categoria?' · '+esc(m.categoria):''} · ${fmtD(m.data)}${m.risultato?' · '+esc(m.risultato):''}</div></div>
  ${m.note?`<p class="pre">${esc(m.note)}</p>`:''}
  ${reps.map((r,i)=>{const p=P(r.playerId)||{};return `<div class="pr-prof"><h2>${i+1}° profilo: ${esc(fullName(p))}${(r.ruoloPartita||p.ruolo)?` <span style="font-weight:400;color:#555">(${esc(r.ruoloPartita||p.ruolo)})</span>`:''}</h2><div class="pr-top">${prPhoto(p)}<div>${prTable(p,r)}${prG(p.giudizio)}</div></div><div class="pr-sub">Analisi tecnica e tattica</div>${prAreas(r)||'<p>—</p>'}</div>`;}).join('')||'<p>Nessun giocatore inserito.</p>'}
  ${prFoot()}`;
  printHTML(html,`Scouting ${matchTitle(m)} ${fmtD(m.data)}`);
}
function pdfPlayer(id){
  const p=P(id);const reps=repsOfPlayer(id);const md=medie(id);const cs=commentsOf(id);
  const med=AREE.filter(([k])=>md[k]).map(([k,l])=>`${l}${prStars(md[k])}`).join(' &nbsp; ');
  const html=`<div class="pr-head"><h1>Scheda giocatore</h1><div class="s">${esc(fullName(p))}</div></div>
  <div class="pr-prof"><div class="pr-top">${prPhoto(p)}<div><h2 style="margin-bottom:4px">${esc(fullName(p))}</h2>${prTable(p)}${prG(p.giudizio)}</div></div>
  ${med||md.voto?`<div class="pr-sub">Media valutazioni (${reps.length} osservazioni)</div><div>${med}${md.voto?` &nbsp; Voto medio <b>${md.voto.toFixed(1)}</b>`:''}</div>`:''}
  ${p.note?`<div class="pr-sub">Note generali</div><p class="pre" style="margin:2px 0">${esc(p.note)}</p>`:''}</div>
  ${reps.map(r=>{const m=M(r.matchId);return `<div class="pr-prof"><h2>${esc(matchTitle(m))} <span style="font-weight:400;color:#555">· ${fmtD(m&&m.data)}${m&&m.categoria?' · '+esc(m.categoria):''}</span></h2><div style="font-size:10pt;color:#444">${r.ruoloPartita?'Ruolo: <b>'+esc(r.ruoloPartita)+'</b> &nbsp; ':''}${r.voto?'Voto: <b>'+esc(r.voto)+'</b>':''}</div>${prAreas(r)||'<p>—</p>'}</div>`;}).join('')}
  ${cs.length?`<div class="pr-prof"><h2>Commenti</h2>${cs.map(c=>`<div class="pr-area"><b>${esc(c.autoreNome||'')}</b> <span style="color:#777;font-size:9pt">${fmtDT(c.createdAt)}</span><p>${esc(c.testo)}</p></div>`).join('')}</div>`:''}
  ${prFoot()}`;
  printHTML(html,`Scheda ${fullName(p)}`);
}

/* =================== BACKUP: EXPORT / IMPORT =================== */
function stamp(){const d=new Date(),z=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}_${z(d.getHours())}${z(d.getMinutes())}`;}
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},2000);}
async function doExport(){
  const data={app:'scouting',version:2,exportedAt:now(),players:S.players,matches:S.matches,reports:S.reports,comments:S.comments};
  const name=`scouting-backup_${stamp()}.json`;const blob=new Blob([JSON.stringify(data)],{type:'application/json'});
  let done=false;
  try{const file=new File([blob],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Backup scouting'});done=true;}}
  catch(e){if(e&&e.name==='AbortError')return;}
  if(!done)download(blob,name);
  toast('Backup esportato');
}
async function doImport(file){
  if(!isScout())return;
  let d;try{d=JSON.parse(await file.text());}catch(e){return toast('File non valido');}
  if(!d||d.app!=='scouting')return toast('Questo file non è un backup dell\'app');
  let add=0,upd=0;
  for(const type of ['players','matches','reports']){
    for(const o of (d[type]||[])){
      const i=S[type].findIndex(x=>x.id===o.id);
      if(i<0){S[type].push(o);add++;}
      else if((o.updatedAt||'')>(S[type][i].updatedAt||'')){S[type][i]=o;upd++;}
      else continue;
      await idbPut(type,o);await idbPut('outbox',{key:type+':'+o.id,tipo:type,id:o.id,deleted:false,ts:now()});
    }
  }
  await countPending();scheduleSync(100);render();
  toast(add+upd?`Importato: ${add} nuovi, ${upd} aggiornati`:'Già tutto aggiornato');
}

/* =================== EVENTI =================== */
const EDIT_ACTIONS=new Set(['newPlayer','editPlayer','newMatch','editMatch','newReport','editReport','pick','pickP','pickNew','setG','delPlayer','delMatch','delReport']);
document.addEventListener('click',async e=>{
  const g=e.target.closest('[data-go]');
  if(g){if(!$('#sheet').hidden)closeSheet();go(g.dataset.go);return;}
  const b=e.target.closest('[data-a]');if(!b)return;
  const a=b.dataset.a,id=b.dataset.id;
  if(EDIT_ACTIONS.has(a)&&!isScout())return;
  switch(a){
    case 'close':closeSheet();break;
    case 'find':fFind();break;
    case 'pg':UI.pg=b.dataset.v;render();break;
    case 'nc':UI.nc=!UI.nc;render();break;
    case 'newPlayer':fPlayer(null);break;
    case 'editPlayer':fPlayer(P(id));break;
    case 'newMatch':fMatch(null);break;
    case 'editMatch':fMatch(M(id));break;
    case 'newReport':fReport({playerId:id});break;
    case 'editReport':{const r=S.reports.find(x=>x.id===id);if(r)fReport(r);break;}
    case 'pick':fPick(id);break;
    case 'pickP':{const mid=SH.pickMatch;const ex=S.reports.find(r=>r.playerId===id&&r.matchId===mid);fReport(ex||{playerId:id,matchId:mid});break;}
    case 'pickNew':{const mid=SH.pickMatch;fPlayer(null,p=>fReport({playerId:p.id,matchId:mid}));break;}
    case 'rmPhoto':SH.foto='';$('#photoPrev').firstElementChild.outerHTML=photoPh();break;
    case 'star':{const k=b.dataset.k,v=+b.dataset.v;SH.voti[k]=SH.voti[k]===v?0:v;b.parentElement.outerHTML=starsIn(k,SH.voti[k]);break;}
    case 'setG':{const p=P(id);p.giudizio=p.giudizio===b.dataset.v?'':b.dataset.v;await save('players',p);render();break;}
    case 'delPlayer':{const p=P(id);const n=repsOfPlayer(id).length;if(!confirm(`Eliminare ${fullName(p)}${n?` e le sue ${n} osservazioni`:''}? L'eliminazione vale per tutti gli utenti.`))return;for(const r of repsOfPlayer(id))await removeRec('reports',r.id);await removeRec('players',id);toast('Giocatore eliminato');go('/giocatori');break;}
    case 'delMatch':{const m=M(id);if(!confirm(`Eliminare la partita ${matchTitle(m)}? Verranno eliminate anche le osservazioni collegate (i giocatori restano in archivio).`))return;for(const r of repsOfMatch(id))await removeRec('reports',r.id);await removeRec('matches',id);toast('Partita eliminata');go('/partite');break;}
    case 'delReport':{if(!confirm('Eliminare questa osservazione?'))return;await removeRec('reports',SH.rep.id);closeSheet();render();toast('Osservazione eliminata');break;}
    case 'delComment':{const c=S.comments.find(x=>x.id===id);if(!c||c.autoreId!==ME.id)return;if(!confirm('Eliminare il commento?'))return;await removeRec('comments',id);render();break;}
    case 'pdfPlayer':pdfPlayer(id);break;
    case 'pdfMatch':pdfMatch(id);break;
    case 'exportShare':doExport();break;
    case 'syncNow':scheduleSync(0);break;
    case 'logout':doLogout();break;
  }
});
document.addEventListener('input',e=>{
  const k=e.target.dataset&&e.target.dataset.in;if(!k)return;UI[k]=e.target.value;
  if(k==='pq'||k==='pr'||k==='pa'||k==='sort'){const l=$('#plist');if(l)l.innerHTML=playerList();}
  else if(k==='mq'){const l=$('#mlist');if(l)l.innerHTML=matchList();}
  else if(k==='fq'){$('#findres').innerHTML=findResults();}
  else if(k==='pick'){$('#picklist').innerHTML=pickResults();}
});
document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.name==='fotofile'&&t.files&&t.files[0]){try{SH.foto=await compress(t.files[0]);$('#photoPrev').firstElementChild.outerHTML=`<img src="${SH.foto}" alt="">`;}catch(err){toast('Impossibile leggere la foto');}t.value='';}
  else if(t.name==='importfile'&&t.files&&t.files[0]){await doImport(t.files[0]);t.value='';}
  else if(t.name==='matchId'&&t.tagName==='SELECT'){$('#newMatch').hidden=t.value!=='__new';}
});
document.addEventListener('submit',async e=>{
  e.preventDefault();const f=e.target;
  if(f.id==='fl'){doLogin(f);return;}
  if(f.id==='fc'){
    const testo=f.elements.testo.value.trim();if(!testo)return;
    await save('comments',{id:uid(),playerId:f.dataset.id,testo,autoreId:ME.id,autoreNome:ME.nome||ME.email});
    META.seen[f.dataset.id]=now();render();toast('Commento inviato');return;
  }
  if(!isScout())return;
  if(f.id==='fp'){
    const d=Object.fromEntries(new FormData(f));delete d.fotofile;
    Object.keys(d).forEach(k=>d[k]=String(d[k]).trim());
    if(!d.cognome)return toast('Il cognome è obbligatorio');
    const base=SH.editId?Object.assign({},P(SH.editId)):{id:uid()};
    Object.assign(base,d,{foto:SH.foto});
    const after=SH.after;await save('players',base);closeSheet();toast('Giocatore salvato');
    if(after)after(base);else go('/giocatore/'+base.id);
    render();
  }
  else if(f.id==='fm'){
    const md=readMatchFields(f);md.note=f.elements.m_note.value.trim();
    if(!md.data||!md.casa||!md.ospite)return toast('Inserisci data e le due squadre');
    const base=SH.editId?Object.assign({},M(SH.editId)):{id:uid()};Object.assign(base,md);
    await save('matches',base);closeSheet();toast('Partita salvata');go('/partita/'+base.id);
  }
  else if(f.id==='fr'){
    const d=Object.fromEntries(new FormData(f));let matchId=d.matchId;
    if(matchId==='__new'){const md=readMatchFields(f);if(!md.data||!md.casa||!md.ospite)return toast('Inserisci data e squadre della nuova partita');const m=await save('matches',Object.assign({id:uid(),note:''},md));matchId=m.id;}
    if(!matchId)return toast('Scegli la partita');
    const r=SH.rep.id?Object.assign({},S.reports.find(x=>x.id===SH.rep.id)):{id:uid(),playerId:SH.rep.playerId};
    const voti={};Object.entries(SH.voti).forEach(([k,v])=>{if(v)voti[k]=v;});
    Object.assign(r,{matchId,ruoloPartita:d.ruoloPartita.trim(),voto:d.voto,voti,testi:{tec:d.t_tec.trim(),tat:d.t_tat.trim(),fis:d.t_fis.trim(),per:d.t_per.trim()},note:d.note.trim()});
    await save('reports',r);
    const p=P(r.playerId);if(p&&(d.giudizio||'')!==(p.giudizio||'')){p.giudizio=d.giudizio;await save('players',p);}
    closeSheet();toast('Osservazione salvata');render();
  }
});

/* =================== AVVIO =================== */
(async()=>{
  try{
    db=await openDB();
    for(const s of TYPES)S[s]=(await idbAll(s))||[];
    META.seen=(await metaGet('seen'))||{};META.seenBase=(await metaGet('seenBase'))||'';
    if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
  }catch(err){$('#view').innerHTML='<div class="pad"><div class="empty-s">Impossibile accedere alla memoria del browser. Se sei in navigazione privata, apri l\'app in una finestra normale.</div></div>';return;}
  if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
  if(!configured()||!window.supabase){showLogin();return;}
  sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
  const cached=await metaGet('me');
  let session=null;try{session=(await sb.auth.getSession()).data.session;}catch(e){}
  if(session){
    if(cached&&cached.id===session.user.id){ME=cached;start();loadProfile(session.user).then(p=>{if(p){ME=p;render();}}).catch(()=>{});}
    else{try{ME=await loadProfile(session.user);}catch(e){}if(ME)start();else showLogin();}
  }else if(cached&&!navigator.onLine){ME=cached;start();}
  else showLogin(cached?'Sessione scaduta: accedi di nuovo.':'');
})();
