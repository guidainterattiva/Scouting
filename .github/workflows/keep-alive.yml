name: Supabase keep-alive
# Il piano gratuito di Supabase mette in pausa i progetti dopo 7 giorni senza attività.
# Questo job "tocca" il database ogni 3 giorni per tenerlo attivo.
on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Ping Supabase
        run: |
          URL=$(grep -oP "SUPABASE_URL='\K[^']+" index.html)
          KEY=$(grep -oP "SUPABASE_KEY='\K[^']+" index.html)
          if [[ "$URL" == INSERISCI* ]]; then echo "Supabase non ancora configurato"; exit 0; fi
          curl -fsS -X POST "$URL/rest/v1/rpc/ping" -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}'
