name: Supabase keep-alive
# 1) Il piano gratuito di Supabase mette in pausa i progetti dopo 7 giorni senza attività:
#    questo job "tocca" il database ogni 3 giorni.
# 2) GitHub disattiva i job programmati nei repo senza commit da 60 giorni:
#    se l'ultimo commit ha più di 30 giorni, il job aggiorna .github/keepalive.txt
#    così il repository resta "attivo" e il job non viene mai sospeso.
on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Ping Supabase
        run: |
          URL=$(grep -oP "SUPABASE_URL='\K[^']+" index.html)
          KEY=$(grep -oP "SUPABASE_KEY='\K[^']+" index.html)
          if [[ "$URL" == INSERISCI* ]]; then echo "Supabase non ancora configurato"; exit 0; fi
          curl -fsS --retry 3 --retry-delay 20 -X POST "$URL/rest/v1/rpc/ping" -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}'
          echo; echo "Supabase raggiunto correttamente"
      - name: Mantieni attivo il repository
        run: |
          LAST=$(git log -1 --format=%ct)
          AGE=$(( ( $(date +%s) - LAST ) / 86400 ))
          echo "Ultimo commit: $AGE giorni fa"
          if [ "$AGE" -ge 30 ]; then
            date -u +"Ultimo keep-alive: %Y-%m-%d %H:%M UTC" > .github/keepalive.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/keepalive.txt
            git commit -m "keep-alive automatico"
            git push
          fi
